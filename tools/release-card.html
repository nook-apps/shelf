:root{color-scheme:dark;--surface:#192030;--paper:#ccd4e8;--muted:#98a8c0;--edge:#ffffff26}
*{box-sizing:border-box}
body{margin:0;background:#131928;color:var(--paper);font:14px Glaze,"DejaVu Sans",sans-serif}
main{max-width:1520px;margin:auto;padding:42px clamp(18px,4vw,64px)}
header{margin-bottom:27px}
h1{margin:0;font-size:clamp(25px,4vw,36px);letter-spacing:-.04em}
.layout{display:grid;grid-template-columns: minmax(250px,302px) minmax(0,1fr);gap:24px;align-items:start}
form{border:1px solid var(--edge);background:var(--surface);border-radius:20px;padding:20px;display:grid;gap:15px}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.categories label,.categories select{min-width:0}
label{display:grid;gap:7px;color:var(--paper);font-size:12px}
input,select,textarea,button{font:inherit;border:1px solid var(--edge);border-radius:8px;padding:10px 11px;color:var(--paper);background:#171b27;width:100%}
textarea{resize:vertical;min-height:58px}
button{cursor:pointer;font-weight:700;background:#2a344e}
button.primary{background:#9fb3ff;color:#171e32}
button:disabled{opacity:.5;cursor:wait}
button:hover:not(:disabled){filter:brightness(1.12)}
:focus-visible{outline:2px solid #9fb3ff;outline-offset:2px}
.buttons{display:grid;gap:8px}
canvas{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--edge)}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}
figure{margin:0}
#feedback{min-height:1em;color:var(--muted);font-size:12px;margin:0}
@media(max-width:780px){main{padding-top:24px}.layout{grid-template-columns:1fr}figure{grid-row:1}}
body.preview main{padding:0;margin:0;max-width:none}
body.preview header,body.preview form,body.preview figcaption{display:none}
body.preview .layout{display:block}
body.preview canvas{border:0;border-radius:0;width:1200px;height:630px}
</style></head>

const defaults = {product:"shelf", language:"ru", type:"release", secondary:"update", title:"Shelf", version:"0.5.0"};
const query = new URLSearchParams(location.search);
if (query.has("preview")) document.body.classList.add("preview");
let language = defaults.language;
let descriptions = {};
let useExampleCopy = true;

for (const [key,product] of Object.entries(products)) fields.product.add(new Option(product.name,key));

function updateCategoryOptions(type,secondary) {
  fields.type.replaceChildren();
  fields.secondary.replaceChildren(new Option(language === "ru" ? "Без метки" : "None",""));
  for (const [key,category] of Object.entries(categories)) {
    fields.type.add(new Option(category[language],key));
    if (key !== type) fields.secondary.add(new Option(category[language],key));
  }
  fields.type.value = type;
  fields.secondary.value = secondary === type ? "" : secondary;
}
function descriptionForLanguage() {
  if (Object.hasOwn(descriptions,language)) return descriptions[language];
  if (Object.keys(descriptions).length) return Object.values(descriptions)[0];
  if (useExampleCopy) return exampleCopy[language];
  const key = fields.product.value;
  return language === "ru" ? products[key].description : productCopy[key];
}
function restoreExample(locale="ru") {
  descriptions = {};
  useExampleCopy = true;
  language = locale;
  for (const key of ["product","title","version"]) fields[key].value = defaults[key];
  fields.language.value = language;
  updateCategoryOptions(defaults.type,defaults.secondary);
  fields.description.value = descriptionForLanguage();
}
function rounded(x,y,w,h,r,fill,stroke) {
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function line(x,y,x2,y2,color) {
  ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x2,y2);
  ctx.strokeStyle = color; ctx.stroke();
}
function text(value,x,y,size,color,weight=400,family="Glaze") {
  ctx.font = weight+" "+size+"px "+family;
  ctx.fillStyle = color;
  ctx.fillText(value,x,y);
}
function tracked(value,x,y,color) {
  ctx.letterSpacing = "3px";
  text(value,x,y,15,color,400,"GlazeMono");
  ctx.letterSpacing = "0px";
}
function wrapped(value,x,y,width) {
  const words = value.split(/\s+/u);
  let row = "";
  ctx.font = "400 25px Glaze, sans-serif";
  for (const word of words) {
    const next = row ? row+" "+word : word;
    if (row && ctx.measureText(next).width > width) {
      text(row,x,y,25,tokens.paper);
      y += 36;
      row = word;
    } else row = next;
  }
  text(row,x,y,25,tokens.paper);
}
function render() {
  ctx.fillStyle = tokens.surface;
  ctx.fillRect(0,0,1200,630);
  const product = products[fields.product.value];
  const accent = tokens[fields.product.value];
  const glass = ctx.createLinearGradient(0,48,0,582);
  glass.addColorStop(0,tokens["tile-top"]+"eb");
  glass.addColorStop(1,tokens["tile-bottom"]+"eb");
  ctx.save();
  ctx.shadowColor = "#0a0d1880"; ctx.shadowBlur = 28; ctx.shadowOffsetY = 14;
  rounded(48,48,1104,534,28,glass);
  ctx.restore();
  rounded(48.5,48.5,1103,533,28,null,accent+"4d");
  const shine = ctx.createLinearGradient(0,49,0,203);
  shine.addColorStop(0,"#ffffff13"); shine.addColorStop(1,"#ffffff00");
  rounded(49,49,1102,532,27,shine);

  const well = ctx.createLinearGradient(0,87,0,543);
  well.addColorStop(0,"#10172655"); well.addColorStop(1,"#111723bb");
  rounded(724,87,389,456,22,well,"#ffffff22");
  ctx.save();
  ctx.beginPath(); ctx.roundRect(725,88,387,454,21); ctx.clip();
  const glow = ctx.createRadialGradient(918,310,24,918,310,244);
  glow.addColorStop(0,accent+"49"); glow.addColorStop(1,accent+"00");
  ctx.fillStyle = glow; ctx.fillRect(724,87,389,456);
  ctx.fillStyle = "#eef1ff20";
  for (let x=745;x<1112;x+=16) for (let y=106;y<542;y+=16) ctx.fillRect(x,y,1.5,1.5);
  ctx.restore();
  for (const [x,y,dx,dy] of [[748,111,1,1],[1089,111,-1,1],[748,519,1,-1],[1089,519,-1,-1]]) {
    line(x,y,x+dx*13,y,"#eef1ff55");
    line(x,y,x,y+dy*13,"#eef1ff55");
  }
  if (product.image?.complete && product.image.naturalWidth) {
    ctx.save(); ctx.shadowColor="#060b1daa"; ctx.shadowBlur=26; ctx.shadowOffsetY=16;
    ctx.drawImage(product.image,786,183,264,264); ctx.restore();
  }

  const active = [fields.type.value,fields.secondary.value].filter(Boolean).map(key => categories[key]);
  let labelX = 88;
  for (const category of active) {
    const label = category[language].toLocaleUpperCase(language);
    ctx.save();
    ctx.shadowColor = category.color;
    ctx.shadowBlur = 9;
    rounded(labelX,91,8,8,4,category.color);
    ctx.restore();
    tracked(label,labelX+21,103,tokens.paper);
    ctx.font = "400 15px GlazeMono";
    ctx.letterSpacing = "3px";
    labelX += 21 + ctx.measureText(label).width + 34;
    ctx.letterSpacing = "0px";
  }
  line(88,126,680,126,"#eef1ff34");

  const title = fields.title.value.trim() || product.name;
  let size = 115;
  ctx.font = "700 "+size+"px Glaze, sans-serif";
  while (ctx.measureText(title).width > 590 && size > 32) {
    size -= 1;
    ctx.font = "700 "+size+"px Glaze, sans-serif";
  }
  ctx.letterSpacing = size >= 80 ? "-5px" : "-1px";
  text(title,82,281,size,tokens.paper,700);
  ctx.letterSpacing = "0px";

  const version = fields.version.value.trim();
  const description = fields.description.value.trim();
  if (version) {
    ctx.font = "400 32px GlazeMono";
    const width = ctx.measureText(version).width+37;
    rounded(88,309,width,54,8,accent+"38",accent+"8c");
    text(version,106,346,32,tokens.paper,400,"GlazeMono");
  }
  if (description) {
    ctx.save();
    ctx.beginPath(); ctx.rect(87,version ? 389 : 318,594,94); ctx.clip();
    wrapped(description,88,version ? 420 : 348,592);
    ctx.restore();
  }
  line(88,482,680,482,"#eef1ff34");
  tracked("NOOK",88,523,tokens.muted);
  fields.card.setAttribute("aria-label",[...active.map(category=>category[language]),title,version,description].filter(Boolean).join(" · "));
}

function filename() {
  const value = [fields.title.value.trim() || products[fields.product.value].name, fields.version.value.trim()]
    .filter(Boolean).join("-").toLowerCase().replace(/[^\p{L}\p{N}._-]+/gu,"-");
  return value+".png";
}
fields.editor.addEventListener("submit",event=>event.preventDefault());
fields.editor.addEventListener("input",event=>{
  if (event.target === fields.product) {
    const product = products[fields.product.value];
    fields.title.value = product.name;
    useExampleCopy = false;
    descriptions = {};
    fields.description.value = descriptionForLanguage();
    fields.version.value = "";
  }
  if (event.target === fields.type) updateCategoryOptions(fields.type.value,fields.secondary.value);
  if (event.target === fields.language) {
    language = fields.language.value;
    updateCategoryOptions(fields.type.value,fields.secondary.value);
    fields.description.value = descriptionForLanguage();
  }
  if (event.target === fields.description) {
    descriptions[language] = fields.description.value;
  }
  fields.feedback.textContent = "";
  render();
});
fields.editor.addEventListener("reset",event=>{
  event.preventDefault();
  restoreExample(language);
  fields.feedback.textContent = "";
  render();
});
fields.export.addEventListener("click",()=>{
  fields.card.toBlob(blob=>{
    if (!blob) { fields.feedback.textContent = "Не удалось экспортировать PNG."; return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename();
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    fields.feedback.textContent = "PNG подготовлен.";
  },"image/png");
});
restoreExample(query.get("lang") === "en" ? "en" : "ru");
// Параметры URL позволяют воспроизвести карточку выпуска без ручного ввода.
if (query.has("product") && products[query.get("product")]) fields.product.value = query.get("product");
if (query.has("title")) fields.title.value = query.get("title");
if (query.has("version")) fields.version.value = query.get("version");
if (query.has("description")) {
  useExampleCopy = false;
  fields.description.value = query.get("description");
}
const type = categories[query.get("type")] ? query.get("type") : fields.type.value;
const secondary = categories[query.get("secondary")] ? query.get("secondary") : "";
if (query.has("type") || query.has("secondary")) updateCategoryOptions(type,secondary);
const assets = Object.values(products).map(product=>{
  product.image = new Image();
  product.image.src = product.icon;
  return product.image.decode();
});
Promise.allSettled([...assets,document.fonts.load("700 115px Glaze"),document.fonts.load("400 25px Glaze"),document.fonts.load("400 32px GlazeMono")]).then(()=>{
  render();
  fields.export.disabled = false;
  document.body.dataset.ready = "true";
});
</script></body></html>
